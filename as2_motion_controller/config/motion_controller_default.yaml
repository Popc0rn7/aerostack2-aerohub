/**:
  ros__parameters:
    cmd_freq: 50.0 # Hz of controller commands send
    info_freq: 10.0 # Hz of controller info publish
    use_bypass: true # Use bypass mode
    trajectory:
      max_age: 0.3 # Maximum source sample age (s)
      max_future: 0.05 # Maximum source clock lead (s)
      timeout: 0.5 # No valid new sample: latch and request hover (s)
    tf_timeout_threshold: 0.05 # TF timeout threshold (s)

    # Frames the active plugin expects for state and references. The
    # ControllerHandler converts incoming pose/twist/trajectory messages to
    # these frames before delivering them to the plugin. Empty takes the
    # canonical odom (pose) and base (twist) frames of the node.
    desired_pose_frame: ""
    desired_twist_frame: ""

    # Standard debug topics published by ControllerHandler. An empty value
    # disables the corresponding publisher. Plugin-specific debug topics
    # live under <plugin_name>.debug.* in each plugin's controller_default.yaml.
    debug:
      state_pose_topic: "state/pose"
      state_twist_topic: "state/twist"
      reference_pose_topic: "reference/pose"
      reference_twist_topic: "reference/twist"
      reference_trajectory_topic: "reference/trajectory"
      compute_output_time_topic: "compute_output_time"
